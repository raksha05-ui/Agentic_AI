readme = "README.md"
authors = [
    { name = "raksha05-ui", email = "billieeilishh005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=0.3.0",
